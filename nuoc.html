<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="js/publish_guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimNước – Mô phỏng xử lý nước cấp</title>
<link rel="stylesheet" href="css/app.css?v=17">
</head>
<body>
<div id="app">
  <header style="background:#0b3d4a">
    <div class="logo">SimNước<span data-ver data-nobi></span><small>nước cấp · tái sử dụng · nước siêu sạch</small></div>
    <div class="pname" id="hdrName"></div>
    <a id="lnkX" href="index.html" target="_blank" style="color:#cde;font-size:13px;margin-right:4px" title="Mở phần mềm nước thải SimXLNT">↔ SimXLNT</a>
    <select id="selTpl" title="Mở sơ đồ mẫu"><option value="">Sơ đồ mẫu…</option></select>
    <button id="btnNew">Mới</button>
    <button id="btnOpen">Mở…</button>
    <button id="btnSave">Lưu</button>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="fs" class="on"><span class="n">1</span>Sơ đồ</button>
    <button data-t="src"><span class="n">2</span>Nước nguồn</button>
    <button data-t="ctrl"><span class="n">3</span>Điều khiển</button>
    <button data-t="sim"><span class="n">4</span>Mô phỏng</button>
    <button data-t="res"><span class="n">5</span>Kết quả</button>
    <button data-t="tools"><span class="n">6</span>Công cụ</button>
    <button data-t="bt"><span class="n">7</span>Bảng tính</button>
    <button data-t="help"><span class="n">?</span>Hướng dẫn</button>
  </nav>
  <main>
    <section class="tab on" id="tab-fs">
      <div class="palette" id="palette"></div>
      <div class="canvasWrap" id="canvasWrap"></div>
      <div class="props" id="props"></div>
    </section>
    <section class="tab" id="tab-src"></section>
    <section class="tab" id="tab-ctrl"></section>
    <section class="tab" id="tab-sim"></section>
    <section class="tab" id="tab-res"></section>
    <section class="tab" id="tab-tools"></section>
    <section class="tab" id="tab-bt"></section>
    <section class="tab help" id="tab-help"></section>
  </main>
  <footer><span id="ftState" class="grow"></span><span id="ftBridge"></span><span>SimNước 1.0 · dùng cho nghiên cứu cá nhân</span></footer>
</div>
<script src="js/i18n_dict.js?v=27"></script>
<script src="js/version.js?v=15"></script>
<script src="js/i18n_core.js?v=1"></script>
<script src="js/w_chem.js?v=10"></script>
<script src="js/w_kin.js?v=10"></script>
<script src="js/w_units.js?v=11"></script>
<script src="js/w_sim.js?v=11"></script>
<script src="js/w_templates.js?v=10"></script>
<script src="js/chart.js?v=32"></script>
<script src="js/flowsheet.js?v=31"></script>
<script src="js/w_fs.js?v=10"></script>
<script src="js/w_ui.js?v=17"></script>
<script src="js/w_ctrl.js?v=2"></script>
<script src="js/w_fix.js?v=1"></script>
<script src="js/xlsx_read.js?v=30"></script>
<script src="js/w_bt.js?v=3"></script>
<script src="js/xch.js?v=14"></script>
<script src="js/appstate.js?v=8"></script>
<script>
// SimNước trong bộ phần mềm: hồ sơ dự án chung, hoàn tác/làm lại (js/appstate.js) – dự án tự lưu sẵn ở khóa WLS (w_ui.js).
// Khởi tạo ngay sau w_ui.js (cùng sự kiện DOMContentLoaded): w_ui đã báo 'hello' cho khung bộ phần mềm, yêu cầu dữ liệu tới sau.
window.addEventListener('DOMContentLoaded', () => {
  // nhãn "biểu tượng + chữ": khi thanh tiêu đề thiếu chỗ (XLNT_FIT mức 4) chỉ còn biểu tượng, tên đầy đủ ở chú thích
  const lbl = (id, ic, vi, en) => { const b = document.getElementById(id); if (!b) return; b.setAttribute('data-nobi', ''); b.title = b.title || vi;
    const d = () => { b.innerHTML = `<span class="ic">${ic}</span><span class="tx"> ${typeof BI !== 'undefined' && BI.mode === 'en' ? en : vi}</span>`; }; d(); if (typeof BI !== 'undefined' && BI.onMode) BI.onMode(d); };
  lbl('btnNew', '🆕', 'Mới', 'New'); lbl('btnOpen', '📂', 'Mở dự án', 'Open project'); lbl('btnSave', '💾', 'Lưu dự án', 'Save project'); lbl('btnBT', '📥', 'Nhập bảng tính…', 'Import workbook…');
  if (window.XLNT_FIT) XLNT_FIT('#app > header', 5);
  // nhận hồ sơ: bản tính nước cấp của XLNuoc (trường xlsx) → tab Bản tính; hồ sơ khác chỉ báo
  const receive = rec => {
    if (rec.xlsx) { const nm = ((rec.project && rec.project.name) || 'XLNuoc').replace(/[^\wÀ-ỹ\- ]+/g, '_') + '.xlsx'; wbtImportBuf(XCH.unb64(rec.xlsx), nm); XCH.toast('Đã nhập bản tính từ ' + XCH.APPS[rec.from].name + ' – xem tab Bản tính'); }
    else XCH.toast('SimNước nhận bản tính nước cấp của XLNuoc. Nước ra của SimXLNT: dùng nút "Gửi nước ra sang SimNước" trong SimXLNT.');
  };
  XCH.init('nuoc', { receive, store: { keys: /^simnuoc\.project\.v1$/, anchor: '#btnSave', apply: s => { const t = s.keys[WLS]; if (!t) return false; wSetProject(JSON.parse(t)); return true; } } });
});
</script>
<script>BI.boot(); BI.mountSwitch(document.querySelector("header"));</script>
</body>
</html>

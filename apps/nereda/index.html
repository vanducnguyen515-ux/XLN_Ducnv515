<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="../../js/publish_guard.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SimXLNT NEREDA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lexend:wght@500;600&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: dải tiêu đề, cột nhập liệu cố định bên trái, cột kết quả cuộn bên phải; xếp một cột trên điện thoại */
:root {
  --bg: #f4f6f8; --panel: #ffffff; --ink: #14202b; --ink-2: #4a5866; --ink-3: #6f7c88;
  --line: #d9e0e6; --line-2: #e9eef2; --accent: #8a5a00; --accent-bg: #fbf1dc;
  --band: #10202e; --band-ink: #eef3f7; --band-ink-2: #a9bccb;
  --ok: #1d7a46; --ok-bg: #e3f3ea; --warn: #8f5b00; --warn-bg: #fdf0d6; --crit: #b3261e; --crit-bg: #fbe4e2; --info: #2a5f96; --info-bg: #e3edf8;
  --ph-f: #2a78d6; --ph-a: #c98500; --ph-s: #1baf7a; --ph-i: #6250d6;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --panel: #151f29; --ink: #e6edf3; --ink-2: #aab8c4; --ink-3: #8696a4;
    --line: #2a3845; --line-2: #1f2b36; --accent: #e8b04a; --accent-bg: #2e2412;
    --band: #0a1118; --band-ink: #eef3f7; --band-ink-2: #8fa5b6;
    --ok: #5cc98a; --ok-bg: #12301f; --warn: #e8b04a; --warn-bg: #33270f; --crit: #f08a82; --crit-bg: #3a1714; --info: #7fb2ea; --info-bg: #142739;
    --ph-f: #3987e5; --ph-a: #c98500; --ph-s: #199e70; --ph-i: #9085e9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --panel: #151f29; --ink: #e6edf3; --ink-2: #aab8c4; --ink-3: #8696a4;
  --line: #2a3845; --line-2: #1f2b36; --accent: #e8b04a; --accent-bg: #2e2412;
  --band: #0a1118; --band-ink: #eef3f7; --band-ink-2: #8fa5b6;
  --ok: #5cc98a; --ok-bg: #12301f; --warn: #e8b04a; --warn-bg: #33270f; --crit: #f08a82; --crit-bg: #3a1714; --info: #7fb2ea; --info-bg: #142739;
  --ph-f: #3987e5; --ph-a: #c98500; --ph-s: #199e70; --ph-i: #9085e9;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; }
.num, td.n, .kpi b { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.band { background: var(--band); color: var(--band-ink); }
.band-in { max-width: 1440px; margin: 0 auto; padding-block: 20px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.band h1 { font-size: 22px; letter-spacing: .01em; }
.band h1 span { color: var(--ph-a); }
.band p { margin: 4px 0 0; color: var(--band-ink-2); max-width: 70ch; font-size: 13px; }
.band .acts { display: flex; gap: 8px; flex-wrap: wrap; }

button { font: 500 13px var(--font-body); border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--ink-3); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--ph-f); outline-offset: 2px; }
.band button { background: transparent; color: var(--band-ink); border-color: #3a4e60; }
.band button:hover { border-color: var(--band-ink-2); }

.wrap { max-width: 1440px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

aside.inputs { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 900px) { aside.inputs { position: static; max-height: none; } }
details.grp { border-bottom: 1px solid var(--line-2); }
details.grp:last-child { border-bottom: 0; }
details.grp > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font: 600 13px var(--font-display); letter-spacing: .02em; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: "+"; color: var(--ink-3); font: 500 16px var(--font-data); }
details.grp[open] > summary::after { content: "–"; }
.fields { padding: 0 16px 14px; display: grid; gap: 8px; }
.f { display: grid; grid-template-columns: minmax(0, 1fr) 96px 64px; gap: 8px; align-items: center; }
.f label { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.f .u { font-size: 11.5px; color: var(--ink-3); min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.f input, .f select { width: 100%; font: 13px var(--font-data); padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); text-align: right; }
.f select { text-align: left; font-family: var(--font-body); }
.f.wide { grid-template-columns: minmax(0, 1fr) 168px; }
.f.wide select { grid-column: 2; }
.hint { font-size: 11.5px; color: var(--ink-3); margin: 2px 0 0; }
.f.off { opacity: .45; }
.pane { display: grid; gap: 20px; min-width: 0; }
[hidden] { display: none !important; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--ink-2); padding: 9px 16px; font: 600 13.5px var(--font-display); margin-bottom: -1px; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--line); }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 90ch; }
ol.steps li { padding-left: 4px; }
ol.steps li b { color: var(--ink); }
.src { color: var(--ink-3); font-size: 12px; }

main { display: grid; gap: 20px; min-width: 0; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; min-width: 0; }
section.card > header { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
section.card h2 { font-size: 16px; }
section.card header p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.eyebrow { font: 500 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

.summary { display: grid; gap: 14px; }
.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-body); padding: 3px 10px; border-radius: 999px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); } .pill.info { background: var(--info-bg); color: var(--info); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.kpi span { font-size: 12px; color: var(--ink-3); }
.kpi b { font-size: 20px; font-weight: 500; color: var(--ink); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi b.sm { font-size: 17px; }
.kpi b small { font: 400 12px var(--font-body); color: var(--ink-3); margin-left: 3px; }
.kpi i { font-style: normal; font-size: 11.5px; color: var(--ink-2); }

ul.warns { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.warns li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; padding: 7px 10px; border-radius: 6px; background: var(--bg); }
ul.warns li .pill { justify-content: center; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
th { font: 500 11.5px var(--font-body); color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
td.n, th.n { text-align: right; white-space: nowrap; }
td.u { color: var(--ink-3); white-space: nowrap; font-size: 12px; }
tr.gov td { background: var(--accent-bg); }
tr.gov td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tag { font: 600 11px var(--font-body); color: var(--accent); margin-left: 6px; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.grid2 > * { min-width: 0; }
h3 { font-size: 13.5px; margin-bottom: 6px; color: var(--ink-2); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 12px; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 4px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.chart { position: relative; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 560px; height: auto; }
.chart svg text { fill: var(--ink-2); font: 11.5px var(--font-body); }
.chart svg text.mono { font-family: var(--font-data); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 9px; border-radius: 5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 8px)); }

.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 100px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .track { position: relative; height: 16px; }
.bar .fill { position: absolute; top: 0; height: 16px; border-radius: 4px; }
.bar .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.bar b { text-align: right; font-weight: 500; }
@media (max-width: 520px) { .bar { grid-template-columns: 110px minmax(0, 1fr) 84px; } .f { grid-template-columns: minmax(0, 1fr) 86px 52px; } }

.note { color: var(--ink-2); font-size: 13px; max-width: 80ch; }
.note li { margin-bottom: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 6px; font-size: 13px; }
textarea.copy { width: 100%; height: 160px; font: 12px var(--font-data); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
@media (prefers-reduced-motion: no-preference) { .bar .fill { transition: width .25s ease, left .25s ease; } }
/* Song ngữ: tiếng Anh nhỏ hơn, mờ hơn, nằm dưới tiếng Việt */
.en { display: block; font-size: .84em; line-height: 1.35; color: var(--ink-3); font-weight: 400; font-style: normal; letter-spacing: 0; text-transform: none; margin-top: 1px; }
.en-i { font-size: .86em; color: var(--ink-3); font-weight: 400; margin-left: .4em; letter-spacing: 0; text-transform: none; }
.band .en, .band .en-i { color: var(--band-ink-2); }
.band h1 .en { font: 400 14px var(--font-body); margin-top: 2px; }
.band h1 .en span, .band h1 span.en { color: var(--band-ink-2); }
th .en { font-size: 10.5px; }
h2 .en { font-family: var(--font-body); font-size: 12.5px; margin-top: 2px; }
h3 .en { font-size: 11.5px; }
.pill .en-i, .tag .en-i, .tabs .en-i, button .en-i { color: inherit; opacity: .72; }
.kpi span .en { font-size: 11px; }
.kpi i { display: block; }
ol.steps li .en, .note li .en { margin-top: 3px; }
.f label .en { font-size: 11px; }
details.grp > summary > span .en { font: 400 11px var(--font-body); letter-spacing: 0; }
.band .seg { border-color: #3a4e60; }
.band .seg button { color: var(--band-ink-2); padding: 6px 10px; }
.band .seg button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); }
/* Bản vẽ & xuất file */
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.dl button { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 600 14px var(--font-display); min-height: 92px; align-content: start; }
.dl button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
.dl button:disabled { opacity: .5; cursor: not-allowed; }
.dl button small { font: 400 12px var(--font-body); color: var(--ink-3); }
.dl button .fx { font: 500 11px var(--font-data); color: var(--accent); letter-spacing: .04em; }
.dl button[aria-busy="true"] { cursor: progress; }
.dl button[aria-busy="true"] .fx::after { content: " …"; }
.dlstat { margin: 10px 0 0; min-height: 1.4em; font-size: 12.5px; color: var(--ink-2); }
.dlstat.err { color: var(--crit); }
.sheets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.sheets button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink-2); font: 500 12.5px var(--font-data); }
.sheets button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.paper { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.paper svg { display: block; width: 100%; min-width: 760px; height: auto; }
.sheetcap { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.secact { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.expbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.expbar p { margin: 2px 0 0; color: var(--ink-3); font-size: 12.5px; }
.expbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.expbtns button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 600 13px var(--font-body); }
.expbtns button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.expbtns button:hover:not(:disabled) { border-color: var(--accent); }
.expbtns button:disabled { opacity: .5; cursor: not-allowed; }
.expbtns button[aria-busy="true"] { cursor: progress; }
.expbtns button.pri .en-i { color: #fff; opacity: .8; }
.band .en, .wrap .en { opacity: 1; }
</style>
</head>
<body>
<div class="band" data-nobi><div class="band-in">
  <div>
    <div class="eyebrow" style="color:var(--band-ink-2)" id="sEyebrow"></div>
    <h1 id="sTitle"></h1>
    <p id="sLead"></p>
  </div>
  <div class="acts">
    <span data-ver data-nobi></span>
    <div class="seg lang" role="group" aria-label="Language / Ngôn ngữ">
      <button type="button" data-lang="bi">Việt · English</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="vi">Tiếng Việt</button>
    </div>
    <button id="btnCopy" type="button"></button>
    <button id="btnPdf" type="button" data-export="pdf"></button>
    <button id="btnDxf" type="button" data-export="dxf"></button>
    <button id="btnXlsx" type="button" data-export="xlsx"></button>
    <button id="btnReset" type="button"></button>
  </div>
</div></div>

<div class="wrap" data-nobi>
  <aside class="inputs" id="inputs"></aside>
  <main id="out">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-design" aria-controls="paneDesign" aria-selected="true"></button>
      <button type="button" role="tab" id="tab-ops" aria-controls="paneOps" aria-selected="false"></button>
      <button type="button" role="tab" id="tab-draw" aria-controls="paneDraw" aria-selected="false"></button>
    </nav>
    <div id="paneDesign" role="tabpanel" aria-labelledby="tab-design" class="pane">
    <section class="card summary" id="sumCard"></section>
    <section class="card" id="expCard"></section>
    <section class="card" id="warnCard"></section>
    <section class="card" id="reactorCard"></section>
    <section class="card" id="cycleCard"></section>
    <section class="card" id="effCard"></section>
    <section class="card" id="airCard"></section>
    <section class="card" id="nutCard"></section>
    <section class="card" id="sludgeCard"></section>
    <section class="card" id="pipeCard"></section>
    <section class="card" id="casCard"></section>
    <section class="card" id="benchCard"></section>
    <section class="card" id="refCard"></section>
    <section class="card" id="methodCard"></section>
    </div>
    <div id="paneOps" role="tabpanel" aria-labelledby="tab-ops" class="pane" hidden>
      <section class="card" id="opsSum"></section>
      <section class="card" id="opsPrep"></section>
      <section class="card" id="opsSeed"></section>
      <section class="card" id="opsStage"></section>
      <section class="card" id="opsSet"></section>
      <section class="card" id="opsMon"></section>
      <section class="card" id="opsTrouble"></section>
      <section class="card" id="opsRoutine"></section>
      <section class="card" id="opsKaumera"></section>
    </div>
    <div id="paneDraw" role="tabpanel" aria-labelledby="tab-draw" class="pane" hidden>
      <section class="card" id="drawExport"></section>
      <section class="card" id="drawPreview"></section>
    </div>
  </main>
</div>
<div class="toast" id="toast" data-nobi hidden></div>

<script>
(function () {

  let LANG = 'bi';
  try { const l = localStorage.getItem(STORE + '-lang'); if (['bi', 'en', 'vi'].includes(l)) LANG = l; } catch (e) {}
  // ngôn ngữ chung của bộ phần mềm (js/i18n_core.js) được ưu tiên
  try { const g = localStorage.getItem('xlnt_lang'); if (['bi', 'en', 'vi'].includes(g)) LANG = g; } catch (e) {}
  const L = (vi, en) => LANG === 'en' ? en : LANG === 'vi' || vi === en ? vi : `${vi}<span class="en" lang="en">${en}</span>`;
  const Li = (vi, en) => LANG === 'en' ? en : LANG === 'vi' || vi === en ? vi : `${vi}<span class="en-i" lang="en">${en}</span>`;
  const Lt = (vi, en) => LANG === 'en' ? en : LANG === 'vi' || vi === en ? vi : `${vi} / ${en}`;

  const UNIT = [['m³/ngày', 'm³/d'], ['kg DS/ngày', 'kg DS/d'], ['kg VSS/ngày', 'kg VSS/d'], ['kg O₂/ngày', 'kg O₂/d'], ['kg/ngày', 'kg/d'], ['t/ngày', 't/d'],

  const PH = { F: [['Nạp kỵ khí + xả nước', 'Anaerobic feed + draw'], '--ph-f'], W: [['Chờ kỵ khí bổ sung', 'Extra anaerobic wait'], '--ph-f', 0.5], A: [['Sục khí (phản ứng)', 'Aeration (reaction)'], '--ph-a'], S: [['Lắng', 'Settling'], '--ph-s'], I: [['Chờ / xả bùn dư', 'Idle / sludge discharge'], '--ph-i'] };
  const PHS = { A: ['Sục khí', 'Aeration'], F: ['Nạp/xả', 'Feed/draw'], W: ['Kỵ khí', 'Anaerobic'], S: ['Lắng', 'Settle'], I: ['Chờ', 'Idle'] };
  function renderCycle(r) {
    const C = r.cycle, rain = cycleMode === 'R';
    const tc = rain ? C.tcR : C.tc, rows = rain ? C.rowsR : C.rowsD;
    const span = 2 * tc, N = rows.length;
    const W = 900, Lm = 70, Rm = 16, top = 24, rh = 28, gap = 8;
    const plotW = W - Lm - Rm, x = t => Lm + t / span * plotW;
    const yAer = top + N * (rh + gap) + 14, aerH = 46;
    const Hsvg = yAer + aerH + 34;
    let s = `<svg viewBox="0 0 ${W} ${Hsvg}" role="img" aria-label="${esc(Lt('Biểu đồ pha chu kỳ các bể', 'Reactor cycle phase chart'))}">`;
    const step = span <= 8 ? 1 : span <= 16 ? 2 : 4;
    for (let t = 0; t <= span + 1e-9; t += step) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${yAer + aerH}" stroke="var(--line-2)"/><text class="mono" x="${x(t)}" y="${Hsvg - 12}" text-anchor="middle">${fmt(t, 0)} h</text>`;
    rows.forEach((rw, k) => {
      const y = top + k * (rh + gap);
      s += `<text x="${Lm - 10}" y="${y + rh / 2 + 4}" text-anchor="end">${T1('Bể', 'R')} ${k + 1}</text>`;
      for (let c = -1; c <= 2; c++) {
        let t0 = rw.offset + c * tc;
        for (const [ph, d] of rw.phases) {
          if (d <= 0) continue;
          const a = Math.max(t0, 0), b = Math.min(t0 + d, span);
          if (b > a + 1e-6) {
            const wpx = Math.max(x(b) - x(a) - 2, 1);
            s += `<rect class="seg-r" x="${x(a) + 1}" y="${y}" width="${wpx}" height="${rh}" rx="4" fill="var(${PH[ph][1]})" fill-opacity="${PH[ph][2] || 1}" data-tip="${esc(`${T1('Bể', 'Reactor')} ${k + 1} · ${Lt(PH[ph][0][0], PH[ph][0][1])} · ${fmt(d * 60, 0)} ${T1('phút', 'min')}`)}"/>`;
            if (wpx > 64) s += `<text x="${x(a) + 8}" y="${y + rh / 2 + 4}" style="fill:#fff;font-weight:500">${T1(PHS[ph][0], PHS[ph][1])}</text>`;
          }
          t0 += d;
        }
      }
    });
    const n = 360; const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n * span; let c = 0; for (const rw of rows) if (E.phaseAt(rw, Math.min(t, span - 1e-6), tc) === 'A') c++; pts.push([t, c]); }
    const yc = c => yAer + aerH - c / Math.max(N, 1) * aerH;
    let d = `M ${x(0)} ${yc(0)}`; for (const [t, c] of pts) d += ` L ${x(t)} ${yc(c)}`; d += ` L ${x(span)} ${yc(0)} Z`;
    s += `<text x="${Lm - 10}" y="${yAer + 12}" text-anchor="end">${T1('Bể sục', 'Aerated')}</text><text x="${Lm - 10}" y="${yAer + 26}" text-anchor="end">${T1('khí', 'tanks')}</text>`;
    s += `<line x1="${Lm}" x2="${W - Rm}" y1="${yc(0)}" y2="${yc(0)}" stroke="var(--ink-3)"/>`;
    s += `<path d="${d}" fill="var(--ph-a)" fill-opacity="0.22" stroke="var(--ph-a)" stroke-width="2"/>`;
    for (let c = 1; c <= N; c++) s += `<text class="mono" x="${W - Rm - 2}" y="${yc(c) + 4}" text-anchor="end" style="font-size:10.5px">${c}</text>`;
    s += `</svg>`;
    const tA = rain ? C.tAr : C.tA, tF = rain ? C.tFr : C.tF, tW = rain ? C.tWr : C.tW;
    const sub = rain ? ['Chế độ mưa: rút ngắn chu kỳ, nạp liên tục luân phiên', 'Storm mode: shorter cycle, continuous alternating feed']
      : r.p.buffer ? ['Mùa khô: nạp theo mẻ từ bể điều hòa', 'Dry weather: batch feed from the buffer'] : ['Mùa khô: nạp liên tục luân phiên, luôn có một bể nhận nước', 'Dry weather: continuous alternating feed, one reactor always receiving flow'];
    const phRows = [[PH.F[0], tF], ...(tW > 0 ? [[[`Chờ kỵ khí bổ sung (đủ ${fmt(r.p.tAnMin * 60, 0)} phút kỵ khí)`, `Extra anaerobic wait (to reach ${fmt(r.p.tAnMin * 60, 0)} min anaerobic)`], tW]] : []), [['Sục khí', 'Aeration'], tA], [['Lắng', 'Settling'], C.tS], [PH.I[0], C.tI]];
    document.getElementById('cycleCard').innerHTML = `
      <header><div><h2>${L('Chu kỳ vận hành', 'Operating cycle')}</h2><p>${L(sub[0], sub[1])}</p></div>
        <div class="seg" role="group" aria-label="${esc(Lt('Chế độ', 'Mode'))}"><button type="button" data-m="D" aria-pressed="${!rain}">${Li('Mùa khô', 'Dry')}</button><button type="button" data-m="R" aria-pressed="${rain}">${Li('Mùa mưa', 'Wet')}</button></div></header>
      <div class="legend">${Object.entries(PH).filter(([k]) => k !== 'W' || tW > 0).map(([, [t, c, o]]) => `<span><i style="background:var(${c});opacity:${o || 1}"></i>${Li(t[0], t[1])}</span>`).join('')}</div>
      <div class="chart" id="cyc">${s}<div class="tip" id="tip" hidden></div></div>
      <div class="tw" style="margin-top:12px"><table><thead><tr><th>${L('Pha', 'Phase')}</th><th class="n">${L('Thời gian', 'Duration')}</th><th class="n">${L('Tỷ lệ chu kỳ', 'Share of cycle')}</th></tr></thead><tbody>
        ${phRows.map(([l, t]) => `<tr><td>${L(l[0], l[1])}</td><td class="n">${h2m(t)}</td><td class="n">${fmt(t / tc * 100, 0)}%</td></tr>`).join('')}
        <tr><td>${L(`<b>Chu kỳ</b> · ${fmt(24 / tc, 1)} mẻ/ngày/bể · tối đa ${rain ? C.kAerR : C.kAer} bể sục khí đồng thời`, `<b>Cycle</b> · ${fmt(24 / tc, 1)} batches/d/reactor · max ${rain ? C.kAerR : C.kAer} reactors aerated at once`)}</td><td class="n"><b>${fmt(tc, 2)} h</b></td><td class="n">100%</td></tr>
      </tbody></table></div>`;
    const host = document.getElementById('cycleCard');
    host.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { cycleMode = b.dataset.m; renderCycle(last); }));
    const tip = document.getElementById('tip'), box = document.getElementById('cyc');
    box.addEventListener('pointermove', ev => {
      const t = ev.target.closest('[data-tip]');
      if (!t) { tip.hidden = true; return; }
      const rb = box.getBoundingClientRect();
      tip.textContent = t.dataset.tip; tip.hidden = false;
      tip.style.left = (ev.clientX - rb.left + box.scrollLeft) + 'px'; tip.style.top = (ev.clientY - rb.top) + 'px';
    });
    box.addEventListener('pointerleave', () => { tip.hidden = true; });
  }

  function hbars(items, unit) {
    const max = Math.max(...items.map(i => Math.abs(i[1])), 1), hasNeg = items.some(i => i[1] < 0);
    const neg = hasNeg ? Math.max(...items.filter(i => i[1] < 0).map(i => -i[1])) : 0;
    const z = neg / (max + neg) * 100, sc = 100 / (max + neg);
    return `<div class="bars">${items.map(([l, v, c, lt]) => {
      const w = Math.abs(v) * sc, left = v >= 0 ? z : z - w;
      return `<div class="bar" title="${esc(lt || '')}: ${fmt(v, 0)} ${u(unit)}"><span>${l}</span><span class="track">${hasNeg ? `<span class="zero" style="left:${z}%"></span>` : ''}<span class="fill" style="left:${left}%;width:${w}%;background:var(${c})"></span></span><b class="num">${fmt(v, 0)}</b></div>`;
    }).join('')}</div>`;

      <ol class="steps">
        ${li(`<b>Tiềm năng:</b> TU Delft nêu tiềm năng lý thuyết 5–10 kg Kaumera khô/người·năm, với phương án hiện tại (${fmt(r.pe.PEbod, 0)} PE theo BOD) là ${fmt(S.kaumeraPot[0], 0)}–${fmt(S.kaumeraPot[1], 0)} t/năm. Con số này tương đương ${fmt(pct[0], 0)}–${fmt(pct[1], 0)}% lượng bùn dư tính toán, nên chỉ là cận trên. Thực tế ở Zutphen thu hồi làm giảm 20–35% lượng bùn, tương ứng ${fmt(S.kaumera[0] * 365 / 1000, 0)}–${fmt(S.kaumera[1] * 365 / 1000, 0)} t DS/năm (${fmt(S.kaumera[0], 0)}–${fmt(S.kaumera[1], 0)} kg DS/ngày). Đã áp dụng ở Epe và Zutphen (Hà Lan).`,
          `<b>Potential:</b> TU Delft cites a theoretical 5–10 kg dry Kaumera per person per year; for this scheme (${fmt(r.pe.PEbod, 0)} PE by BOD) that is ${fmt(S.kaumeraPot[0], 0)}–${fmt(S.kaumeraPot[1], 0)} t/yr. This equals ${fmt(pct[0], 0)}–${fmt(pct[1], 0)}% of the calculated excess sludge, so it is an upper bound. At Zutphen recovery cut sludge by 20–35%, i.e. ${fmt(S.kaumera[0] * 365 / 1000, 0)}–${fmt(S.kaumera[1] * 365 / 1000, 0)} t DS/yr (${fmt(S.kaumera[0], 0)}–${fmt(S.kaumera[1], 0)} kg DS/d). Applied at Epe and Zutphen (Netherlands).`)}
        ${li('<b>Nguồn bùn:</b> Kaumera theo định nghĩa của TU Delft chiết từ bùn xả chọn lọc mỗi chu kỳ (bông bùn + hạt nhỏ), cô đặc tới khoảng 5% TS.', '<b>Sludge source:</b> as defined by TU Delft, Kaumera is extracted from the per-cycle selection discharge (flocs + small granules), thickened to about 5% TS.')}
        ${li('<b>Quy trình chiết (quy mô thực):</b> thêm KOH giữ pH 9–11, 80 °C trong 2 giờ có khuấy → ly tâm tách cặn kiềm → thêm HCl tới pH 2–4 → ly tâm thu gel Kaumera (5–12% TS, chất bay hơi khoảng 70% TS; protein 50–70%, cacbohydrat khoảng 25% chất hữu cơ).', '<b>Full-scale extraction:</b> KOH to pH 9–11 at 80 °C for 2 h with mixing → centrifuge off the alkaline residue → HCl to pH 2–4 → centrifuge to collect the Kaumera gel (5–12% TS, about 70% volatile; proteins 50–70%, carbohydrates about 25% of organics).')}
        ${li('<b>Vận hành ảnh hưởng tới chất lượng Kaumera:</b> SRT, châm sắt khử P, polymer châm trước khi lấy bùn, thời gian lưu bùn trong bể đệm. Nếu định thu hồi Kaumera, hạn chế châm hóa chất khử P và giảm thời gian lưu bùn trước khi chiết; Kaumera từ bùn nước thải công nghiệp thường ít kim loại nặng hơn bùn đô thị.', '<b>Operation affects Kaumera quality:</b> SRT, iron dosing for P, polymer added before sampling, and storage time in the sludge buffer. If Kaumera is to be recovered, limit chemical P dosing and shorten storage before extraction; Kaumera from industrial sludge usually has fewer heavy metals than from municipal sludge.')}

  // Excel: mỗi thẻ kết quả thành một sheet; lấy chữ đúng như trên trang, ô số chuyển về số thật.
  function parts(el) {
    const c = el.cloneNode(true), ens = [...c.querySelectorAll('.en, .en-i')];
    c.querySelectorAll('.tag').forEach(x => { x.textContent = ' — ' + x.textContent; });
    const en = ens.map(x => x.textContent).join(' ').replace(/\s+/g, ' ').trim();
    ens.forEach(x => x.remove());
    return { vi: c.textContent.replace(/\s+/g, ' ').trim(), en };
  }
  function parseNum(s) {
    const t = String(s).replace(/[  ]/g, ' ').trim();
    const re = LANG === 'en' ? /^([+\-−]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?$/ : /^([+\-−]?)(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?$/;
    const m = t.match(re); if (!m) return null;
    const v = parseFloat(m[2].replace(/[.,]/g, '') + (m[3] ? '.' + m[3] : ''));
    return { v: m[1] && m[1] !== '+' ? -v : v, d: m[3] ? m[3].length : 0 };
  }
  const NUMFMT = d => d ? '#,##0.' + '0'.repeat(d) : '#,##0';
  const XL_CARDS = [['sumCard', 'Tổng quan', 'Summary'], ['warnCard', 'Cảnh báo', 'Warnings'], ['reactorCard', 'Bể phản ứng', 'Reactors'], ['cycleCard', 'Chu kỳ', 'Cycle'],
    ['effCard', 'Chất lượng ra', 'Effluent'], ['airCard', 'Cấp khí', 'Aeration'], ['nutCard', 'N, P & hóa chất', 'N, P & chemicals'], ['sludgeCard', 'Bùn', 'Sludge'],
    ['pipeCard', 'Ống & thiết bị', 'Pipes & equipment'], ['casCard', 'So sánh CAS', 'CAS comparison'], ['benchCard', 'Đối chiếu trạm thực', 'Benchmarks'], ['refCard', 'Nguồn số liệu', 'Data sources']];
  function xlSheet(wb, name) {
    const ws = wb.addWorksheet(name.slice(0, 31), { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
    ws.properties.defaultRowHeight = 16;
    ws._w = [];
    ws.put = (vals, style) => {
      const rw = ws.addRow(vals.map(v => v && typeof v === 'object' ? v.v : v));
      vals.forEach((v, i) => {
        const cell = rw.getCell(i + 1);
        if (v && typeof v === 'object') cell.numFmt = NUMFMT(v.d);
        const len = v == null ? 0 : String(v && typeof v === 'object' ? v.v : v).length;
        ws._w[i] = Math.max(ws._w[i] || 8, Math.min(len + 2, 64));
        if (style === 'th') { cell.font = { bold: true, color: { argb: 'FF33424F' } }; cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9EEF2' } }; cell.border = { bottom: { style: 'thin', color: { argb: 'FFB7C2CC' } } }; }
        else if (style === 'h3') cell.font = { bold: true, color: { argb: 'FF8A5A00' } };
        else if (style === 'gov') cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFBF1DC' } };
        cell.alignment = { vertical: 'top', wrapText: len > 64 };
      });
      return rw;
    };
    ws.done = () => { ws._w.forEach((w, i) => { ws.getColumn(i + 1).width = w; }); };
    return ws;
  }
  function xlTitle(ws, card) {
    const h2 = card.querySelector('header h2'), sub = card.querySelector('header p');
    if (h2) { const t = parts(h2); const r = ws.put([t.vi]); r.getCell(1).font = { bold: true, size: 14 }; if (t.en) ws.put([t.en]).getCell(1).font = { italic: true, color: { argb: 'FF6F7C88' } }; ws._w[0] = Math.max(ws._w[0] || 8, 40); }
    if (sub) { const t = parts(sub); const r = ws.put([t.vi + (t.en ? ' · ' + t.en : '')]); r.getCell(1).font = { italic: true, color: { argb: 'FF6F7C88' } }; ws._w[0] = Math.min(ws._w[0], 64); }
    ws.addRow([]);
  }
  function xlCard(ws, card) {
    const bi = LANG === 'bi';
    const lab = el => { const t = parts(el); return bi ? [t.vi, t.en || t.vi] : [t.vi]; };
    const val = el => { const t = el.textContent.replace(/\s+/g, ' ').trim(); return parseNum(t) || t; };
    for (const el of card.querySelectorAll('h3, table, .kpi, .bar, ul.warns > li')) {
      if (el.tagName === 'H3') { if (ws.lastRow && ws.lastRow.cellCount) ws.addRow([]); ws.put(lab(el).slice(0, 1).concat(bi ? lab(el).slice(1) : []), 'h3'); continue; }
      if (el.classList.contains('kpi')) {
        const b = el.querySelector('b').cloneNode(true), sm = b.querySelector('small'); const unit = sm ? sm.textContent.trim() : ''; if (sm) sm.remove();
        ws.put(lab(el.querySelector('span')).concat([val(b), unit, parts(el.querySelector('i')).vi])); continue;
      }
      if (el.classList.contains('bar')) {
        const tt = el.getAttribute('title') || '', unit = tt.split(': ').pop().replace(/^[^ ]+ /, '');
        ws.put(lab(el.querySelector('span')).concat([val(el.querySelector('b')), unit])); continue;
      }
      if (el.tagName === 'LI') { const sp = el.children; ws.put([parts(sp[0]).vi].concat(lab(sp[1]))); continue; }
      const hd = el.querySelector('thead tr');
      if (hd) { const ths = [...hd.children]; ws.put(lab(ths[0]).concat(ths.slice(1).map(th => { const t = parts(th); return t.en ? `${t.vi} / ${t.en}` : t.vi; })), 'th'); }
      for (const tr of el.querySelectorAll('tbody tr')) {
        const tds = [...tr.children]; if (!tds.length) continue;
        ws.put(lab(tds[0]).concat(tds.slice(1).map(td => td.classList.contains('n') || /^[\d+\-−]/.test(td.textContent.trim()) ? val(td) : parts(td).vi)), tr.classList.contains('gov') ? 'gov' : '');
      }
      ws.addRow([]);
    }
  }
  function xlInputs(wb) {
    const ws = xlSheet(wb, T1('Đầu vào', 'Inputs')), bi = LANG === 'bi';

    const X = (vi, en, v, un) => [Lt(vi, en), v, u(un)];
    const rows = [[Lt('Hạng mục', 'Item'), Lt('Giá trị', 'Value'), Lt('Đơn vị', 'Unit')],
      X('Lưu lượng trung bình', 'Average flow', fmt(r.flow.Q, 0), 'm³/ngày'), X('Số bể', 'Reactors', r.p.Nr, 'bể'), X('Thể tích mỗi bể', 'Volume per reactor', fmt(R.VR, 0), 'm³'), X('Tổng thể tích', 'Total volume', fmt(R.Vtot, 0), 'm³'),
      X('Diện tích mỗi bể', 'Area per reactor', fmt(R.A, 0), 'm²'), X('Chiều sâu nước', 'Water depth', fmt(r.p.H, 1), 'm'), X('Tiêu chí khống chế', 'Governing criterion', Lt(R.gov, R.govEn), ''),
      X('SRT tổng', 'Total SRT', fmt(r.kin.SRT, 1), 'ngày'), X('SRT hiếu khí', 'Aerobic SRT', fmt(r.kin.SRTa, 1), 'ngày'), X('Chu kỳ mùa khô', 'Dry-weather cycle', fmt(r.cycle.tc, 2), 'h'),
      X('AOR', 'AOR', fmt(A.R0, 0), 'kg O₂/ngày'), X('Tổng khí thiết kế', 'Design air flow', fmt(A.airTot, 0), 'Sm³/h'), X('Công suất máy thổi khí', 'Blower shaft power', fmt(A.kWdesign, 0), 'kW'),
      X('Điện năng cấp khí', 'Aeration energy', fmt(A.kWhm3, 3), 'kWh/m³'), X('Bùn dư', 'Excess sludge', fmt(S.PxTSS, 0), 'kg DS/ngày'), X('Methanol', 'Methanol', fmt(r.carbon.methanolKg, 0), 'kg/ngày'),
      X('Hóa chất khử P', 'P-removal chemical', fmt(r.phos.chemSol, 0), r.p.pChem === 'PAC' ? 'kg/ngày' : 'L/ngày'),
      X('BOD5 ra', 'Effluent BOD5', fmt(e.BOD, 1), 'mg/L'), X('COD ra', 'Effluent COD', fmt(e.COD, 1), 'mg/L'), X('TSS ra', 'Effluent TSS', fmt(e.TSS, 1), 'mg/L'), X('NH4-N ra', 'Effluent NH4-N', fmt(e.NH4, 2), 'mg/L'),
      X('NO3-N ra', 'Effluent NO3-N', fmt(e.NO3, 1), 'mg/L'), X('TN ra', 'Effluent TN', fmt(e.TN, 1), 'mg/L'), X('TP ra', 'Effluent TP', fmt(e.TP, 2), 'mg/L')];
    return rows.map(x => x.join('\t')).join('\n');
  }
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2400); }
  function copyText(txt, okMsg, selMsg, hostId) {
    const fallback = () => {
      let ta = document.getElementById('copyBox');
      if (!ta) { ta = document.createElement('textarea'); ta.id = 'copyBox'; ta.className = 'copy'; ta.readOnly = true; }
      document.getElementById(hostId || 'sumCard').appendChild(ta);
      ta.value = txt; ta.focus(); ta.select(); toast(selMsg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(okMsg), fallback);
    else fallback();
  }
  document.getElementById('btnCopy').addEventListener('click', () => copyText(reportTSV(last), Lt('Đã sao chép, dán được vào Excel', 'Copied, ready to paste into Excel'), Lt('Đã chọn sẵn bảng, nhấn Ctrl+C để sao chép', 'Table selected, press Ctrl+C to copy')));
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-export]');
    if (b && !b.disabled) { ({ pdf: exportPdf, dxf: exportDxf, xlsx: exportXlsx })[b.dataset.export](); return; }
    const g = ev.target.closest('[data-goto]');
    if (g && !g.disabled) { showTab(g.dataset.goto); document.getElementById('out').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    state = Object.assign({}, D);
    try { localStorage.removeItem(STORE); } catch (e) {}
    document.getElementById('inputs').innerHTML = '';
    buildForm(); run(); toast(Lt('Đã khôi phục giá trị mặc định', 'Defaults restored'));
  });
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    LANG = b.dataset.lang; nf = {};
    try { localStorage.setItem(STORE + '-lang', LANG); } catch (e) {}
    applyStatic(); buildForm(); run();
    if (typeof BI !== 'undefined' && BI.mode !== LANG) BI.setMode(LANG);   // đồng bộ bộ phần mềm & hộp thoại trao đổi
  }));
  // giao tiếp với bộ trao đổi hồ sơ (js/xch_nr.js)
  window.NR = {
    get state() { return state; }, get last() { return last; }, D, E, toast,
    apply(obj) {
      Object.assign(state, obj);
      document.getElementById('inputs').innerHTML = '';
      buildForm(); run();
    },
    // ngôn ngữ đổi từ khung bộ phần mềm / nút chuyển chung
    setLang(m) {
      if (!['bi', 'en', 'vi'].includes(m) || m === LANG) return;
      LANG = m; nf = {};
      try { localStorage.setItem(STORE + '-lang', LANG); } catch (e) {}
      applyStatic(); buildForm(); run();
    }
  };

  applyStatic(); buildForm(); run();
  (function () {
    const hs = { '#van-hanh': 'ops', '#operations': 'ops', '#ban-ve': 'draw', '#drawings': 'draw' };
    let t = hs[location.hash] || null;
    if (!t) { try { t = localStorage.getItem(STORE + '-tab'); } catch (e) {} }
    if (t === 'ops' || t === 'draw') showTab(t);
  })();
})();
</script>

<script src="../../js/xch.js?v=14"></script>
<script src="../../js/appstate.js?v=8"></script>
<script src="js/xch_nr.js?v=6"></script>
<script>
  // song ngữ chung: nội dung NEREDA tự hiển thị song ngữ (data-nobi); bộ i18n chỉ dịch hộp thoại trao đổi hồ sơ
  BI.boot();
  (function () { const b = document.getElementById('biCss'); if (b) document.head.insertBefore(b, document.head.firstChild); })();
  BI.onMode(m => NR.setLang(m));
  NR.setLang(BI.mode);
</script>

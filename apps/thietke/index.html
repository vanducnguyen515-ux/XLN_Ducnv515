<header class="top">
  <div class="brand"><b>Thiết kế XLNT</b><span data-ver data-nobi></span><small>M&amp;E 5th · ICEAS · QCVN</small></div>
  <div class="proj" id="projTitle"></div>
  <div class="altsel"><label>Phương án</label><select id="altSel"></select></div>
  <div class="tools">
    <select id="selSample" title="Nạp mẫu tính: mẫu nhà cung cấp (ICEAS, C-Tech, MBR Kubota) và bộ bảng tính Excel M&amp;E 5th"></select>
    <button id="btnNew" title="Dự án mới với số liệu mặc định">Mới</button>
    <button id="btnOpen" title="Mở tệp dự án (.xlnt.json)">Mở…</button>
    <button id="btnSave" title="Lưu tệp dự án (.xlnt.json)">Lưu</button>
    <span id="langSw"></span>
    <input type="file" id="fileOpen" accept=".json,.xlnt" hidden>
  </div>
</header>
<nav class="side" id="nav"></nav>
<main id="main"></main>
<footer id="foot"></footer>
<div id="toast"></div>

<!doctype html>
<html lang="vi">
<head>

<script src="../../js/publish_guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaDesign VN</title>
<link rel="stylesheet" href="css/app.css">

<body>
<header>
  <div class="logo">AquaDesign VN<span data-ver data-nobi></span> <small>thiết kế trạm XLNT bùn hoạt tính</small></div>
  <div class="pname" id="pname"></div>
  <button class="btn" id="btnTheme" title="Sáng / tối">◐</button>
</header>
<nav class="menubar" id="menubar"></nav>
<main>
  <section class="card" id="mainCard">
    <div class="linebar">
      <div class="seg" id="lineSeg">
        <button data-line="CAS">Bùn hoạt tính liên tục</button>
        <button data-line="SBR">SBR</button>
        <button data-line="ICEAS">ICEAS</button>
        <button data-line="CTECH">C-Tech</button>
        <button data-line="MBR">MBR</button>
      </div>
      <span class="chip" id="chipStd"></span>
      <span class="chip" id="chipProc"></span>
    </div>
    <div id="diagram"></div>
  </section>
  <aside class="card" id="side">
    <h3>Kết quả chính</h3>
    <div id="summary"></div>
    <h3 style="margin-top:12px">Thông báo</h3>
    <ul class="msgs" id="msgs"></ul>
  </aside>
</main>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileOpen" accept=".adv,.json" hidden>

<script src="js/eng_main.js?v=s5"></script>
